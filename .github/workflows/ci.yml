# suanfatong 仓库 CI（修复计划 7/7 四仓 CI 补齐）：flutter analyze + flutter test。
# Windows 桌面打包不在 CI 范围——BLK-001（开发者模式）属本地打包环境；
# 客户端安装经 winknow 安装包 student 组件通道（Build-Release.ps1 -FlutterBuildRoot）。
#
# CI 首跑修正（2026-10-08）：
# 1. flutter-version 钉 3.29.3——本地基线即 3.29.3，pubspec.lock 已入库；
#    stable 最新版的 Dart/intl 解析与 lock 冲突，CI 必须与本地基线一一对应。
# 2. runs-on 改 windows-latest——Windows 桌面 App（path_provider/桥接探测路径），
#    与本地测试基线同平台，消除平台差异变量。
name: Suanfatong CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
  workflow_dispatch:

jobs:
  flutter:
    name: Flutter（analyze / test）
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.29.3
          cache: true

      - name: 安装依赖
        run: flutter pub get

      - name: 静态分析（error/warning 级失败）
        run: flutter analyze

      - name: 运行测试
        run: flutter test
