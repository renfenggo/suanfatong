# suanfatong 仓库 CI（修复计划 7/7 四仓 CI 补齐）：flutter analyze + flutter test。
# CI 同时验证 Windows Release 构建并保留安装包注入用的完整客户端目录。
#
# CI 首跑修正（2026-10-08）：
# 1. flutter-version 钉 3.29.3——本地基线即 3.29.3，pubspec.lock 已入库；
#    stable 最新版的 Dart/intl 解析与 lock 冲突，CI 必须与本地基线一一对应。
# 2. runs-on 改 windows-latest——Windows 桌面 App（path_provider/桥接探测路径），
#    与本地测试基线同平台，消除平台差异变量。
name: Suanfatong CI

on:
  push:
    branches: [main, develop, "feature/**", "codex/**"]
  pull_request:
  workflow_dispatch:

jobs:
  flutter:
    name: Flutter（analyze / test）
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.29.3
          cache: true

      - name: 安装依赖
        run: flutter pub get

      - name: 静态分析（error/warning 级失败）
        run: flutter analyze

      - name: 运行测试
        run: flutter test

      - name: 构建 Windows Release 客户端
        run: flutter build windows --release

      - name: 校验 Release 核心文件
        shell: pwsh
        run: |
          $root = 'build/windows/x64/runner/Release'
          foreach ($file in @('bfs_learn.exe', 'flutter_windows.dll', 'url_launcher_windows_plugin.dll', 'data/icudtl.dat', 'data/app.so', 'data/flutter_assets/AssetManifest.bin')) {
            if (-not (Test-Path (Join-Path $root $file) -PathType Leaf)) {
              throw "Release 文件缺失: $file"
            }
          }

      - name: 保存 Windows Release 产物
        uses: actions/upload-artifact@v4
        with:
          name: suanfatong-windows-release-${{ github.sha }}
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14
